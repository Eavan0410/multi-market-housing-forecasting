[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-forecast"
version = "0.1.0"
description = "Multi-market housing price forecasting with cross-market transfer learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dl = ["torch>=2.1"]
stats = ["statsmodels>=0.14"]   # ARIMA baseline
imapp = ["openpyxl>=3.1"]
llm = ["vllm"]            # GPU machine only; not needed for the mock backend

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
